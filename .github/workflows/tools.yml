name: Tools environment
# Purpose of this workflow is to check that all binary the project
# is recommending are installable and usable on openSUSE TW.
# This workflow refer to th eDockerfile in the root of the repo.
on:
  push:
    branches:
      - 'main'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'Dockerfile.leap'
      - 'requirements.txt'
      - 'requirements.yml'
      - '.github/workflows/tools.yml'
      - 'terraform/azure/version.tf'
      - 'terraform/aws/version.tf'
      - 'terraform/gcp/version.tf'
env:
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        opensuse-version: ['Dockerfile', 'Dockerfile.leap']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.opensuse-version }} image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          push: false
          load: true # Export to Docker Engine rather than pushing to a registry
          tags: ${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: ${{ matrix.opensuse-version }}

      - name: Test
        run: |
          cre=docker ./tools/image_test.sh ${{ github.run_id }}
