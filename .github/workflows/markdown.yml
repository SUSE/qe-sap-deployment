name: 'Markdown'

on:
  push:
    branches:
      - 'main'
  pull_request:
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'terraform/aws/README.md'
      - 'terraform/azure/README.md'
      - 'terraform/gcp/README.md'
      - '.github/workflows/markdown.yml'

permissions:
  contents: read

jobs:
  markdown_lint:
    name: 'Markdown lint'
    runs-on: ubuntu-24.04
    environment: production
    strategy:
      matrix:
        docfile: ['README.md', 'CONTRIBUTING.md', 'terraform/aws/README.md', 'terraform/gcp/README.md', 'terraform/azure/README.md']

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: markdownlint-cli
      uses: nosborn/github-action-markdown-cli@508d6cefd8f0cc99eab5d2d4685b1d5f470042c1  # v3.5.0
      with:
        files: ${{ matrix.docfile }}
        config_file: .markdownlint.json

    - name: Spell-check Markdown files
      uses: streetsidesoftware/cspell-action@ce1816e4ce36532956ac6e983737392774b6e169  # v9.2.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        incremental_files_only: false
        config: 'cspell.json'
        files: ${{ matrix.docfile }}
