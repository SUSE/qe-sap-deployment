---
- name: SAP Hana preconfigure
  hosts: hana
  become: true
  become_user: root
  environment:
    ZYPP_LOCK_TIMEOUT: '120'

  pre_tasks:
    - name: Source hana install variables
      ansible.builtin.include_vars: ./vars/hana_vars.yaml

    - name: Detect cloud platform
      ansible.builtin.include_tasks:
        ./tasks/detect-cloud-platform.yaml


  vars:
    use_sapconf: false
    # Set use_reboottimeout default value to 1200,
    # as for AWS 'r5b.metal' instance type the reboot elapses at least 800 seconds
    use_reboottimeout: 1200
    use_connecttimeout: 10
    saptune_solution: HANA
    cluster_node: true
    firewall_cfg: 'ignore'

  tasks:
    - name: Validate firewall_cfg
      ansible.builtin.assert:
        that:
          - firewall_cfg is defined
          - firewall_cfg in ['ignore', 'enable', 'disable']
        fail_msg: "Variable 'firewall_cfg' must be 'ignore', 'enable' or 'disable'. Found '{{ firewall_cfg }}'"

    - name: Get service facts
      ansible.builtin.service_facts:

    - name: Debug firewall status on specific OS version
      ansible.builtin.debug:
        msg:
          - "[OSADO][softfail] bsc#1254356"
          - "The firewalld service is not stopped and disabled on this system."
      when:
        - ansible_distribution_major_version == '16'
        - firewall_cfg != 'ignore'  # avoid to hide the bug by forcing the firewall state

    - name: Set firewall service state and enabled status
      ansible.builtin.set_fact:
        firewall_service_state: "{{ 'started' if firewall_cfg == 'enable' else 'stopped' }}"
        firewall_service_enabled: "{{ 'yes' if firewall_cfg == 'enable' else 'no' }}"

    - name: Configure the firewall service state
      ansible.builtin.systemd:
        name: firewalld
        state: "{{ firewall_service_state }}"
        enabled: "{{ firewall_service_enabled }}"
      when: firewall_cfg != 'ignore'

    # sapconf is installed by pre-cluster.yaml, but only when it exists here at
    # all. As for saptune below, the two reasons it can be missing need
    # different answers: an image and repository set without sapconf (skip the
    # tuning) and a pre-cluster.yaml that was never run (fail, and say so).
    - name: Gather the package facts for sapconf
      ansible.builtin.package_facts:
        manager: auto
      when: use_sapconf | bool

    - name: Look for sapconf
      ansible.builtin.command:
        cmd: zypper --non-interactive search --match-exact --type package sapconf
      register: qesap_sapconf_search
      changed_when: false
      failed_when: false
      environment:
        # the output is parsed below; community.general.zypper pins C too
        LC_ALL: C
      when:
        - use_sapconf | bool
        - ansible_facts.packages['sapconf'] is not defined

    - name: Assert the sapconf probe was conclusive
      ansible.builtin.assert:
        that:
          - qesap_sapconf_search.rc in [0, 104]
          - qesap_sapconf_search.rc == 0 or
            (qesap_sapconf_search.stdout ~ ' ' ~ qesap_sapconf_search.stderr)
            is not search('(?i)error|problem loading|not loaded|no repositories defined')
        fail_msg: >-
          Could not determine whether sapconf is available, so it is not
          silently treated as missing. Either zypper exited with an unexpected
          code, or it reported a repository error; both are environment
          problems. zypper exited {{ qesap_sapconf_search.rc }}.
          {{ (qesap_sapconf_search.stdout ~ ' ' ~ qesap_sapconf_search.stderr) | trim | truncate(400) }}
        success_msg: "The sapconf availability probe is conclusive"
      when:
        - use_sapconf | bool
        - ansible_facts.packages['sapconf'] is not defined

    - name: Assert sapconf was installed when it was available
      ansible.builtin.assert:
        that:
          - qesap_sapconf_search.rc == 104
        fail_msg: >-
          sapconf exists on this system's repositories or image but is not
          installed. It is
          installed by the 'pre-cluster.yaml' playbook, which has to run before
          this one with the same 'use_sapconf' value that is used here
          (currently {{ use_sapconf | default(false) }}).
        success_msg: >-
          sapconf is not available at all, the tuning is skipped
      when:
        - use_sapconf | bool
        - ansible_facts.packages['sapconf'] is not defined

    - name: Configure sapconf based systems
      ansible.builtin.include_tasks: ./tasks/sapconf.yaml
      when:
        - use_sapconf | bool
        - ansible_facts.packages['sapconf'] is defined

    # saptune is installed by pre-cluster.yaml, but only when it exists here at
    # all. There are two reasons it can be missing and they need different
    # answers: an image and repository set without saptune (skip the tuning)
    # and a pre-cluster.yaml that was never run (fail, and say so).
    - name: Gather the package facts
      ansible.builtin.package_facts:
        manager: auto
      when: not use_sapconf | bool

    - name: Look for saptune
      ansible.builtin.command:
        cmd: zypper --non-interactive search --match-exact --type package saptune
      register: qesap_saptune_search
      changed_when: false
      failed_when: false
      environment:
        # the output is parsed below; community.general.zypper pins C too
        LC_ALL: C
      when:
        - not use_sapconf | bool
        - ansible_facts.packages['saptune'] is not defined

    - name: Assert the saptune probe was conclusive
      ansible.builtin.assert:
        that:
          - qesap_saptune_search.rc in [0, 104]
          - qesap_saptune_search.rc == 0 or
            (qesap_saptune_search.stdout ~ ' ' ~ qesap_saptune_search.stderr)
            is not search('(?i)error|problem loading|not loaded|no repositories defined')
        fail_msg: >-
          Could not determine whether saptune is available, so it is not
          silently treated as missing. Either zypper exited with an unexpected
          code, or it reported a repository error; both are environment
          problems. zypper exited {{ qesap_saptune_search.rc }}.
          {{ (qesap_saptune_search.stdout ~ ' ' ~ qesap_saptune_search.stderr) | trim | truncate(400) }}
        success_msg: "The saptune availability probe is conclusive"
      when:
        - not use_sapconf | bool
        - ansible_facts.packages['saptune'] is not defined

    - name: Assert saptune was installed when it was available
      ansible.builtin.assert:
        that:
          - qesap_saptune_search.rc == 104
        fail_msg: >-
          saptune exists on this system's repositories or image but is not
          installed. It is
          installed by the 'pre-cluster.yaml' playbook, which has to run before
          this one with the same 'use_sapconf' value that is used here
          (currently {{ use_sapconf | default(false) }}).
        success_msg: >-
          saptune is not available at all, the tuning is skipped
      when:
        - not use_sapconf | bool
        - ansible_facts.packages['saptune'] is not defined

    # saptune to be handled here with more included tasks!
    - name: Configure saptune based systems
      ansible.builtin.include_tasks: ./tasks/saptune.yaml
      when:
        - not use_sapconf | bool
        - ansible_facts.packages['saptune'] is defined

  # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/reboot_module.html#parameters
  # reboot_timeout Maximum seconds to wait for machine to reboot and respond to a test command.  Default: 600
  handlers:
    - name: Reboot
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible - after sap hana preconfigure"
        reboot_timeout: "{{ use_reboottimeout | int }}"
        connect_timeout: "{{ use_connecttimeout | int }}"
