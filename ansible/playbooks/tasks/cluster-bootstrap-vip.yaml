---
# Common VIP (cluster IP) management tasks shared by AWS and GCP.
# Assumes the cluster IP resource has already been created by the
# provider-specific task file.
#
# Required variables (must be passed by the caller via vars:):
#   vip_resource     - The Pacemaker resource identifier to target in move/clear.
#                      On AWS: the standalone primitive name, e.g.
#                        rsc_ip_<SID>_HDB<NN>
#                      On GCP: the group name that wraps rsc_ip and the
#                        healthcheck probe, i.e. grp_ip_hc
#                      Using the group name on GCP follows Pacemaker's
#                      documented best practice: constraints should reference
#                      the group rather than a member primitive. Move and clear
#                      MUST target the same identifier; mixing them would leave
#                      a stale INFINITY cli-prefer-* constraint in the CIB that
#                      blocks automatic failover until manually cleared.
#
# Inherited variables (set upstream, not passed via vars:):
#   sap_hana_install_sid             - SAP HANA SID (used only in locate/wait
#                                      commands to verify the resource name)
#   sap_hana_install_instance_number - SAP HANA instance number (same as above)
#   primary_hostname  - Hostname of the primary HANA node.
#                       On GCP with SBD this variable is NOT set (the SBD and
#                       native-fencing branches are mutually exclusive); the
#                       move/clear tasks are gated on the locate result so they
#                       only execute when primary_hostname is defined.
#   is_primary        - Boolean; all tasks in this file are gated on is_primary.
#
# Optional variables (may be passed by the caller via vars:):
#   vip_errlogfile   - Path of the error log of the health check resource
#                      (on GCP: rsc_healthcheck_primary, agent "anything").
#                      If set, the rescue tasks show the last 50 lines.
#                      The file is local to each node. The rescue tasks read
#                      it on the primary node only.

- name: Validate required variable vip_resource
  ansible.builtin.assert:
    that:
      - vip_resource is defined
      - vip_resource | length > 0
    fail_msg: >-
      vip_resource must be passed by the caller (e.g. the group name grp_ip_hc
      on GCP or the primitive name rsc_ip_<SID>_HDB<NN> on AWS).

- name: Locate cluster IP
  ansible.builtin.command:
    cmd: >-
      crm resource locate
      {{ vip_resource }}
  register: reg_vip_location
  changed_when: false
  when: is_primary
  until: reg_vip_location.stderr == ''
  retries: 10
  delay: 6

- name: Move VIP and wait for placement
  when:
    - is_primary
    - reg_vip_location.stdout | trim | split(' ') | last != primary_hostname
  block:
    - name: Move cluster IP to primary HANA node
      ansible.builtin.command:
        cmd: >-
          crm resource move
          {{ vip_resource }}
          {{ primary_hostname }}
      register: reg_move_cmd
      changed_when: reg_move_cmd.rc == 0
      until: reg_move_cmd.rc == 0
      retries: 10
      delay: 6

    - name: Wait for the IP move to complete
      ansible.builtin.command:
        cmd: >-
          crm resource locate
          {{ vip_resource }}
      register: reg_vip_location2
      changed_when: false
      until: reg_vip_location2.stdout_lines | length > 0 and reg_vip_location2.stdout_lines[0] | trim | split(' ') | last == primary_hostname
      retries: 10
      delay: 6

  rescue:
    - name: Collect cluster status (crm_mon)
      ansible.builtin.command:
        cmd: crm_mon -1rf
      register: reg_diag_crm_mon
      changed_when: false
      failed_when: false

    - name: Collect resource allocation scores (crm_simulate)
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          crm_simulate -Ls | grep -E '{{ vip_resource }}|rsc_healthcheck|rsc_ip_'
      register: reg_diag_crm_simulate
      changed_when: false
      failed_when: false

    - name: Collect VIP error log
      ansible.builtin.command:
        cmd: "tail -n 50 {{ vip_errlogfile }}"
      register: reg_diag_vip_errlog
      changed_when: false
      failed_when: false
      when:
        - vip_errlogfile is defined
        - vip_errlogfile | length > 0

    - name: Display cluster status (crm_mon)
      ansible.builtin.debug:
        var: reg_diag_crm_mon.stdout_lines
      when: reg_diag_crm_mon.stdout_lines is defined

    - name: Display resource allocation scores (crm_simulate)
      ansible.builtin.debug:
        var: reg_diag_crm_simulate.stdout_lines
      when: reg_diag_crm_simulate.stdout_lines is defined

    - name: Display VIP error log
      ansible.builtin.debug:
        var: reg_diag_vip_errlog.stdout_lines
      when:
        - reg_diag_vip_errlog is defined
        - reg_diag_vip_errlog.stdout_lines is defined

    - name: Fail after VIP move failure
      ansible.builtin.fail:
        msg: >-
          Task '{{ ansible_failed_task.name | default('unknown') }}' failed:
          {{ ansible_failed_result.msg | default(ansible_failed_result.stderr | default('no message')) }}.
          Could not place {{ vip_resource }} on primary node {{ primary_hostname }}.
          See the diagnostic output above.

- name: Clear the move constraint
  ansible.builtin.command:
    cmd: >-
      crm resource clear
      {{ vip_resource }}
  changed_when: true
  when:
    - is_primary
    - reg_vip_location.stdout | trim | split(' ') | last != primary_hostname

# For debug purpose only
- name: Get cluster status at the end
  ansible.builtin.command:
    cmd: crm configure show
  changed_when: false
