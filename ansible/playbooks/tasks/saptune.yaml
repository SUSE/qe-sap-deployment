---
- name: Gather service facts
  ansible.builtin.service_facts:

# saptune and its patterns-cockpit dependency are installed by
# packages-install.yaml, which has to be executed right after registration.yaml.
- name: Gather package facts
  ansible.builtin.package_facts:
    manager: auto

# Without this the conditions below dereference ansible_facts.packages['saptune'][0]
# and the play dies with 'dict object has no attribute saptune'.
- name: Assert saptune is installed
  ansible.builtin.assert:
    that:
      - ansible_facts.packages['saptune'] is defined
    fail_msg: >-
      saptune is not installed. It is installed by the 'packages-install.yaml'
      playbook, which has to run before this one with the same 'use_sapconf'
      value that is used here (currently {{ use_sapconf | default(false) }}).
    success_msg: "saptune is installed"

# patterns-cockpit is a dependency introduced in saptune 3.2.3 on SLES 16
# and is expected to be eventually dropped.
# https://bugzilla.suse.com/show_bug.cgi?id=1262794#c4 and https://bugzilla.suse.com/show_bug.cgi?id=1262794#c5
- name: Softfail for patterns-cockpit saptune dependency
  ansible.builtin.debug:
    msg:
      - "[OSADO][softfail] bsc#1262794 patterns-cockpit saptune dependency will be eventually removed"
  when:
    - ansible_facts.packages['saptune'][0].version is version('3.2.3', '>=')
    - ansible_distribution_major_version == '16'

- name: Collect TSX diagnostic information
  ansible.builtin.shell: |
    set -o pipefail
    printf '=== CPU: model / hypervisor / virt-type ===\n'
    lscpu | grep -iE 'Model name|Hypervisor|Virtualization type'
    printf '=== Kernel config: CONFIG_X86_INTEL_TSX ===\n'
    grep CONFIG_X86_INTEL_TSX "/boot/config-$(uname -r)" 2>/dev/null || echo '(not found)'
    printf '=== TAA mitigation ===\n'
    cat /sys/devices/system/cpu/vulnerabilities/tsx_async_abort 2>/dev/null || echo '(not found)'
    printf '=== saptune grub:tsx note sections ===\n'
    for n in 3577842 2684254; do
      f="/usr/share/saptune/notes/$n"
      [ -f "$f" ] && grep -E '^\[grub|^tsx=' "$f"
    done
    true
  register: tsx_diag
  changed_when: false
  failed_when: false
  when:
    - ansible_facts.packages['saptune'][0].version is version('3.2.3', '>=')
    - ansible_distribution_major_version == '16'

- name: Show TSX diagnostic information
  ansible.builtin.debug:
    var: tsx_diag.stdout_lines
  when:
    - ansible_facts.packages['saptune'][0].version is version('3.2.3', '>=')
    - ansible_distribution_major_version == '16'

# WORKAROUND for SAP Note 3577842 grub:tsx on cloud VMs (TEAM-11186, bsc#1263100).
#
# saptune >= 3.2.3 on SLES 16 checks that tsx=auto appears in /proc/cmdline.
# The check tag [grub:arch=x86_64] has no virt= filter, so it fires on cloud VMs
# where tsx=auto is absent from the default boot cmdline. On VMs the parameter has
# no independent security effect — the hypervisor handles TAA mitigation at the host
# level — but saptune solution verify returns rc=1 without it.
#
# Adding a virt= filter is not planned for the short term because cloud providers
# also offer bare-metal instance types.
# Until saptune gains finer-grained virtualization detection, we inject
# tsx=auto into GRUB ourselves so that /proc/cmdline satisfies the check.
#
# WHEN TO REMOVE: this block can be removed once ONE of the following happens:
#   1. saptune adds a virt= filter to the [grub] tsx check in SAP Note 3577842,
#      so the check no longer fires on hypervisor guests; OR
#   2. SLES 16 kernels ship with CONFIG_X86_INTEL_TSX_MODE_AUTO=y (as SLES 15 SP7
#      does since kernel 6.4.0-150700.53.11), making the boot parameter redundant
#      and saptune presumably scopes the check to specific kernel versions; OR
#   3. Cloud SLES-for-SAP images start shipping with tsx=auto already in GRUB.
- name: Check if tsx parameter is already in kernel cmdline
  ansible.builtin.command: grep -q tsx= /proc/cmdline
  register: tsx_cmdline_check
  changed_when: false
  failed_when: false
  when:
    - ansible_facts.packages['saptune'][0].version is version('3.2.3', '>=')
    - ansible_distribution_major_version == '16'

- name: Add tsx=auto to GRUB defaults for saptune compliance
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT="(?:(?!tsx=).)*)"$'
    line: '\1 tsx=auto"'
    backrefs: true
  register: grub_tsx_update
  when:
    - tsx_cmdline_check is not skipped
    - tsx_cmdline_check.rc != 0

- name: Regenerate GRUB configuration for tsx=auto
  ansible.builtin.command: grub2-mkconfig -o /boot/grub2/grub.cfg  # noqa: no-handler
  changed_when: true
  when: grub_tsx_update is changed

- name: Reboot to apply tsx=auto kernel parameter
  ansible.builtin.reboot:  # noqa: no-handler
    msg: "Reboot initiated by Ansible - GRUB tsx=auto for SAP Note 3577842"
    reboot_timeout: "{{ use_reboottimeout | default(1200) | int }}"
    connect_timeout: "{{ use_connecttimeout | default(10) | int }}"
  when: grub_tsx_update is changed

- name: Regather service facts after reboot
  ansible.builtin.service_facts:  # noqa: no-handler
  when: grub_tsx_update is changed

- name: Ensure conflicting services are stopped and disabled
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - sapconf.service
    - tuned.service
  when:
    - item in ansible_facts.services
    - ansible_facts.services[item].status != 'not-found'

- name: Ensure saptune is running and enabled
  ansible.builtin.systemd:
    name: saptune
    state: started
    enabled: true

- name: Ensure saptune_check executes correctly
  ansible.builtin.command: saptune_check
  register: sapchk
  changed_when: false
  failed_when: sapchk.rc != 0

- name: Discover active solution
  ansible.builtin.command: saptune solution enabled
  register: saptune_status
  changed_when: false

- name: Set fact for active solution
  ansible.builtin.set_fact:
    solution_configured: "{{ (saptune_status.stdout | regex_search('(\\S+)', '\\1'))[0] | default('NONE') }}"  # Capture the first block on none whitespace

- name: Show configured solution
  ansible.builtin.debug:
    var: solution_configured

# If this is a cluster node on Azure, we need to override to disable tcp timestamps, reuse and recycle.
# This can be done by copying the sapnote file 2382421 from /usr/share/saptune/notes to /etc/saptune/override
# The value can then override in the in the new file

- name: Disable TCP timestamps, recycle & reuse
  ansible.builtin.blockinfile:
    path: /etc/saptune/override/2382421
    create: true
    backup: true
    owner: root
    group: root
    mode: '0640'
    marker: "<!-- {mark} ANSIBLE MANAGED BLOCK -->"
    block: |
     [sysctl]
     net.ipv4.tcp_timestamps = 0
     net.ipv4.tcp_tw_reuse = 0
     net.ipv4.tcp_tw_recycle = 0
  when:
    - cluster_node
    - cloud_platform_is_azure

- name: Check if saptune solution needs to be applied
  ansible.builtin.command: "saptune solution verify {{ saptune_solution }}"
  register: verify
  changed_when: false  # We're only checking, not changing!
  failed_when: false  # We expect this to fail if it has not previously been applied

- name: Ensure no solution is currently applied
  ansible.builtin.command: "saptune solution revert {{ solution_configured }}"
  when:
    - solution_configured != 'NONE'
    - verify.rc != 0
  changed_when: true  # This task, when run, is expected to make a change

- name: Ensure saptune solution is applied
  ansible.builtin.command: "saptune solution apply {{ saptune_solution }}"
  when: verify.rc != 0
  changed_when: true  # This task, when run, is expected to make a change

- name: Ensure solution was successful
  ansible.builtin.command: "saptune solution verify {{ saptune_solution }}"
  changed_when: false  # We're only checking, not changing!
