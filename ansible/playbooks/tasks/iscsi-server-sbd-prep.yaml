---
# targetcli-fb, and the removal of the packages conflicting with it on 12-SP5,
# are handled by packages-install.yaml, which has to be executed right after
# registration.yaml.
#
# The assert matters most on 12-SP5: there the image ships the incompatible
# 'targetcli', which provides the same binary name. Without the removal done
# by packages-install.yaml the targetcli commands below would not fail, they
# would silently configure the wrong implementation.
- name: Gather the package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Assert targetcli-fb is installed
  ansible.builtin.assert:
    that:
      - ansible_facts.packages['targetcli-fb'] is defined or
        ansible_facts.packages['python3-targetcli-fb'] is defined
      # Only 12-SP5 ships the incompatible 'targetcli' alongside the fb one
      - ansible_distribution_major_version != '12' or
        ansible_facts.packages['targetcli'] is not defined
    fail_msg: >-
      targetcli-fb is not installed, or the conflicting 'targetcli' is still
      present. Both are handled by the 'packages-install.yaml' playbook, which
      has to run before this one.
    success_msg: "targetcli-fb is installed"

- name: Load AWS disk configuration
  ansible.builtin.include_vars: ./vars/aws_iscsi_storage_profile.yaml
  when: cloud_platform_is_aws and not aws_machine_type_is_r4

- name: Load AWS disk configuration for R4 instance
  ansible.builtin.include_vars: ./vars/aws_r4_iscsi_storage_profile.yaml
  when: cloud_platform_is_aws and aws_machine_type_is_r4


- name: Load Azure disk configuration
  ansible.builtin.include_vars: ./vars/azure_iscsi_storage_profile.yaml
  when: cloud_platform_is_azure

- name: Load GCP disk configuration
  ansible.builtin.include_vars: ./vars/gcp_iscsi_storage_profile.yaml
  when: cloud_platform_is_gcp

- name: Prepare iscsi disks
  vars:
    qe_sap_storage_cloud_type: 'generic'
    qe_sap_storage_action: 'prepare'
  ansible.builtin.include_role:
    name: qe_sap_storage

- name: Configure HANA SBD target
  ansible.builtin.command:
    cmd: "{{ item.command }}"
    creates: "{{ item.creates }}"
  with_items:
    - {'command': 'targetcli backstores/fileio create {{ backstore_name }} /srv/sbd/{{ backstore_name }} 50M write_back=false', 'creates': '/srv/sbd/{{ backstore_name }}'}
    - {'command': 'targetcli iscsi/ create {{ srv_iqn }}', 'creates': '/sys/kernel/config/target/iscsi/{{ srv_iqn }}'}
    - {'command': 'targetcli iscsi/{{ srv_iqn }}/tpg1/luns/ create /backstores/fileio/{{ backstore_name }}', 'creates': '/sys/kernel/config/target/iscsi/{{ srv_iqn }}/tpgt_1/lun/lun_0'}

- name: Configure client ACLs
  ansible.builtin.command:
    cmd: "targetcli iscsi/{{ srv_iqn }}/tpg1/acls/ create {{ item }}"
    creates: '/sys/kernel/config/target/iscsi/{{ srv_iqn }}/tpgt_1/acls/{{ item }}'
  with_items: "{{ client_list }}"

- name: Open iscsi port 3260/tcp
  become: true
  ansible.posix.firewalld:
    port: 3260/tcp
    state: enabled
    permanent: true
    immediate: true
  when:
    - firewall_cfg | default('ignore') == 'enable'
